[package]
name = "cw-multi-test"
version = "2.2.0"
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Dariusz Depta <DariuszDepta@users.noreply.github.com>",
]
description = "Testing tools for multi-contract interactions"
repository = "https://github.com/CosmWasm/cw-multi-test"
homepage = "https://cosmwasm.com"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
backtrace = ["anyhow/backtrace"]
staking = ["cosmwasm-std/staking"]
stargate = ["cosmwasm-std/stargate"]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm_1_1", "cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm_1_2", "cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm_1_3", "cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm_1_4", "cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm_2_0", "cosmwasm-std/cosmwasm_2_1"]
tokenfactory = [
    "dep:osmosis-std-derive",
    "dep:chrono",
    "dep:prost-types",
    "dep:serde-cw-value",
]


[dependencies]
anyhow = "1.0.89"
bech32 = "0.11.0"
chrono = { version = "0.4.39", optional = true }
cosmwasm-schema = "2.1.3"
cosmwasm-std = "2.1.4"
cw-storage-plus = "2.0.0"
cw-utils = "2.0.0"
itertools = "0.13.0"
osmosis-std-derive = { version = "0.26.0", optional = true }
prost = "0.13.3"
prost-types = { version = "0.13.4", optional = true }
schemars = "0.8.21"
serde = "1.0.210"
serde-cw-value = { version = "0.7.0", optional = true }
sha2 = "0.10.8"
thiserror = "1.0.64"

[dev-dependencies]
hex = "0.4.3"
hex-literal = "0.4.1"
once_cell = "1.19.0"
